name: Checks
on:
  pull_request:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Site builds
        run: npm run build
      - name: Guard (heavy files, stray files, junk)
        run: BASE_REF=origin/${{ github.base_ref }} npm run check
